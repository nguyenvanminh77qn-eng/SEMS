
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEMS - Hệ thống quản lý sự kiện sinh viên</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f9;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 35px;
        }

        .portals {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .portal {
            flex: 1;
            min-width: 260px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .portal h2 {
            margin-top: 0;
            color: #1e293b;
        }

        .portal p {
            color: #64748b;
            min-height: 45px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            margin-top: 15px;
        }

        .student-btn {
            background: #2563eb;
        }

        .admin-btn {
            background: #16a34a;
        }

        .btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>SEMS</h1>
        <p class="subtitle">Hệ thống quản lý sự kiện và hoạt động sinh viên</p>

        <div class="portals">
            <!-- Cổng sinh viên -->
            <div class="portal">
                <h2>Student Portal</h2>
                <p>Đăng ký sự kiện, điểm danh và theo dõi hoạt động sinh viên.</p>
                <a href="pages/student/index.html" class="btn student-btn">
                    Vào trang sinh viên
                </a>
            </div>

            <!-- Cổng quản trị -->
            <div class="portal">
                <h2>Admin Portal</h2>
                <p>Quản lý sự kiện và hoạt động sinh viên trên hệ thống.</p>
                <a href="pages/admin/overview.html" class="btn admin-btn">
                    Vào trang quản trị
                </a>
            </div>
        </div>
    </div>
</body>
</html>
