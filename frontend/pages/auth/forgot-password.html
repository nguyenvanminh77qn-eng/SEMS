<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quên mật khẩu – SEMS</title>
<link rel="stylesheet" href="../../css/auth/common.css">
<link rel="stylesheet" href="../../css/auth/forgot-password.css">
</head>
<body class="auth-page">
<div class="shell narrow">
  <main class="main">
    <div class="top">
      <a class="back" id="back" href="../../pages/auth/login.html">&larr; Quay lại</a>
    </div>

    <!-- Bước 1: Xác minh bằng OTP -->
    <section id="step1" aria-labelledby="t1">
      <h1 id="t1" class="title">Quên mật khẩu</h1>
      <p class="sub">Nhập tên đăng nhập và email, nhận mã OTP để đặt lại mật khẩu.</p>
      <form id="f1" novalidate>
        <div class="grid2">
          <div class="field">
            <label for="username">Tên đăng nhập</label>
            <input id="username" type="text" placeholder="Nhập tên đăng nhập" autocomplete="username">
            <p class="err" id="e-username" role="alert"></p>
          </div>
          <div class="field">
            <label for="otp">Mã OTP</label>
            <input id="otp" type="text" inputmode="numeric" maxlength="6" placeholder="Nhập mã OTP" autocomplete="one-time-code">
            <p class="err" id="e-otp" role="alert"></p>
          </div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <div class="inline">
            <input id="email" type="email" placeholder="Nhập email" autocomplete="email">
            <button type="button" class="btn-otp" id="sendOtp">Gửi OTP</button>
          </div>
          <p class="hint" id="otpHint">Mã OTP sẽ được gửi tới email này.</p>
          <p class="err" id="e-email" role="alert"></p>
        </div>
        <button class="submit" type="submit">Xác nhận</button>
      </form>
    </section>

    <!-- Bước 2: Tạo mật khẩu mới -->
    <section id="step2" aria-labelledby="t2" hidden>
      <h1 id="t2" class="title">Tạo mật khẩu mới</h1>
      <p class="sub">Mật khẩu mới cần có ít nhất 8 ký tự.</p>
      <form id="f2" novalidate>
        <div class="field">
          <label for="password">Mật khẩu mới</label>
          <div class="pw"><input id="password" type="password" placeholder="Nhập mật khẩu mới" autocomplete="off" data-lpignore="true" data-1p-ignore><button type="button" class="eye" data-target="password" aria-label="Hiện mật khẩu"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          <p class="err" id="e-password" role="alert"></p>
        </div>
        <div class="field">
          <label for="password2">Nhập lại mật khẩu mới</label>
          <div class="pw"><input id="password2" type="password" placeholder="Nhập lại mật khẩu mới" autocomplete="off" data-lpignore="true" data-1p-ignore><button type="button" class="eye" data-target="password2" aria-label="Hiện mật khẩu"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          <p class="err" id="e-password2" role="alert"></p>
        </div>
        <button class="submit" type="submit">Tạo mật khẩu mới</button>
      </form>
    </section>

    <!-- Hoàn tất -->
    <section id="done" class="finish" hidden>
      <div class="ok"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div>
      <h1 class="title">Đã đặt lại mật khẩu</h1>
      <p class="sub">Bạn có thể đăng nhập bằng mật khẩu mới.</p>
      <a class="submit" href="../../pages/auth/login.html">Đăng nhập</a>
    </section>
  </main>
</div>
<script src="../../js/pages/auth/forgot-password.js"></script>
</body>
</html>
