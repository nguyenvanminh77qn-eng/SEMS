<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danh sách sự kiện - Cổng thông tin sinh viên Đại học Quy Nhơn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/student/student.css">
  <link rel="stylesheet" href="../../css/student/event-list.css">
</head>
<body data-nav="events">
  <div id="siteHeaderSlot"></div>

  <main class="container">
    <nav class="crumbs" aria-label="Đường dẫn">
      <a class="back" href="#" data-back>&lsaquo; Quay lại</a>
      <span class="sep">/</span><a href="home.html">Trang chủ</a>
      <span class="sep">/</span><span aria-current="page">Sự kiện</span>
    </nav>

    <div class="page-head">
      <h1 class="page-title">Danh sách sự kiện</h1>
    </div>

    <form class="search-row" id="searchForm" role="search">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" type="search" id="q" placeholder="Tìm theo tên sự kiện" aria-label="Tìm theo tên sự kiện" autocomplete="off">
      </div>
      <button class="btn btn-primary" type="submit">Tìm kiếm</button>
    </form>

    <div class="layout">
      <aside class="card filters" aria-label="Bộ lọc">
        <fieldset class="filter-group" id="fType">
          <legend>Loại sự kiện</legend>
          <label class="check"><input type="checkbox" value="van-hoa"> Văn hóa</label>
          <label class="check"><input type="checkbox" value="the-thao"> Thể thao</label>
          <label class="check"><input type="checkbox" value="tinh-nguyen"> Tình nguyện</label>
          <label class="check"><input type="checkbox" value="hoc-thuat"> Học thuật</label>
        </fieldset>

        <fieldset class="filter-group" id="fStatus">
          <legend>Trạng thái</legend>
          <label class="check"><input type="radio" name="status" value="all" checked> Tất cả</label>
          <label class="check"><input type="radio" name="status" value="ongoing"> Đang diễn ra</label>
          <label class="check"><input type="radio" name="status" value="upcoming"> Sắp diễn ra</label>
          <label class="check"><input type="radio" name="status" value="ended"> Đã kết thúc</label>
        </fieldset>

        <fieldset class="filter-group" id="fOther">
          <legend>Khác</legend>
          <label class="check"><input type="checkbox" value="points"> Có điểm rèn luyện</label>
          <label class="check"><input type="checkbox" value="mine"> Sự kiện tôi đã đăng ký</label>
        </fieldset>

        <div class="filter-group">
          <label class="label" for="sort">Sắp xếp</label>
          <select class="input" id="sort">
            <option value="nearest">Ngày gần nhất</option>
            <option value="latest">Ngày xa nhất</option>
            <option value="name">Tên A-Z</option>
            <option value="seats">Nhiều chỗ nhất</option>
          </select>
        </div>

        <button class="btn btn-block" id="clear" type="button">Xóa bộ lọc</button>
      </aside>

      <section aria-label="Kết quả">
        <p class="result-count" id="count" aria-live="polite"></p>
        <div class="ev-list" id="evList"></div>
      </section>
    </div>
  </main>

  <script src="../../js/student/student.js"></script>
  <script src="../../js/student/event-list.js"></script>
</body>
</html>
