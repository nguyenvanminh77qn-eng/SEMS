<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tổng quan - SEMS Admin</title>
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/pages/admin/event-shared.css">
  <link rel="stylesheet" href="../../css/pages/admin/overview.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
</head>
<body data-sems-page="overview">
  <div id="sems-layout"></div>
  <main class="main-content">

    <div class="ev-page-head">
      <div>
        <h1 class="page-title">Tổng quan</h1>
        <!-- <p class="ev-page-sub">Lối tắt quản trị, sự kiện và điểm danh</p> -->
      </div>
      <span class="dash-date" id="todayLabel"></span>
    </div>

    <!-- 1. Lối tắt nhanh (nút nhỏ) -->
    <!-- <nav class="quick-links" aria-label="Lối tắt chức năng">
      <a class="quick-link" href="events.html">Quản lý sự kiện</a>
      <a class="quick-link" href="news.html">Quản lý tin tức</a>
      <a class="quick-link" href="students.html">Quản lý tài khoản</a>
      <a class="quick-link" href="notifications.html">Gửi thông báo</a>
      <a class="quick-link" href="stats-events.html">Thống kê sự kiện</a>
      <a class="quick-link" href="training-score.html">Đánh giá điểm rèn luyện</a>
    </nav> -->

    <!-- 2. KPI của hệ thống -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Tổng số sinh viên</div>
        <div class="kpi-value">1,500</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Tổng số sự kiện</div>
        <div class="kpi-value">120</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">CLB / Đơn vị tổ chức</div>
        <div class="kpi-value">150</div>
      </div>
    </section>

    <!-- 3. Sự kiện + sắp diễn ra + biểu đồ -->
    <div class="dash-grid">

      <section class="card">
        <div class="dash-head">
          <div>
            <h2 class="dash-title">Danh sách sự kiện</h2>
            <p class="ev-page-sub">Các sự kiện đang được quản lý</p>
          </div>
          <a class="btn btn-primary" href="events.html">Xem tất cả</a>
        </div>
        <div id="dashboardEvents" class="dash-event-list"></div>
      </section>

      <aside class="card">
        <div class="dash-head">
          <div>
            <h2 class="dash-title">Sắp diễn ra</h2>
            <p class="ev-page-sub">Các sự kiện kế tiếp theo kế hoạch</p>
          </div>
          <span class="dash-count" id="upcomingCount">0</span>
        </div>
        <ol id="upcomingList" class="dash-upcoming"></ol>

        <div class="dash-chart-head">
          <h3>Thống kê điểm danh</h3>
          <span class="ev-page-sub">Tổng hợp các sự kiện</span>
        </div>
        <div class="dash-chart-wrap"><canvas id="attendanceChart"></canvas></div>
        <div class="dash-legend">
          <span><i class="legend-present"></i>Số lượng đi</span>
          <span><i class="legend-absent"></i>Số lượng vắng</span>
        </div>
      </aside>
    </div>
  </main>

  <script src="../../js/config/navigation.js"></script>
  <script src="../../js/components/layout.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../../js/pages/admin/event-shared.js"></script>
  <script src="../../js/pages/admin/overview.js"></script>
</body>
</html>
