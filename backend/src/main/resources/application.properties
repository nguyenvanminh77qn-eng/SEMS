spring.application.name=sems-backend
server.port=${SERVER_PORT:8080}

# ---------- Database (dùng chung file SQL tổng: SEMS_MySQL_Create_Database.sql) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sems_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
# Cấu trúc bảng do file SQL quản lý, Hibernate KHÔNG tự tạo/sửa bảng.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---------- Mail (gửi OTP) ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Cấu hình ứng dụng ----------
# JWT_SECRET phải dài tối thiểu 32 ký tự. Giá trị mặc định chỉ dùng khi chạy local.
app.jwt.secret=${JWT_SECRET:sems-dev-only-secret-change-me-before-deploy-0123456789}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7

app.otp.ttl-minutes=5
app.otp.max-attempts=5
app.otp.resend-seconds=60

app.login.max-failures=5
app.login.lock-minutes=15

# MAIL_ENABLED=false: không gửi email thật, mã OTP được in ra console (chỉ dùng khi dev).
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@sems.local}

app.cors.allowed-origins=http://localhost:5501,http://127.0.0.1:5501,http://localhost:5500,http://127.0.0.1:5500

# SEED_ENABLED=true: tạo sẵn 3 tài khoản mẫu (admin / organizer / student). Nhớ tắt khi triển khai thật.
app.seed.enabled=${SEED_ENABLED:true}
